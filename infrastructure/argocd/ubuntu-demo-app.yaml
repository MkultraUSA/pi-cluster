apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ubuntu-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: pi-cluster
  source:
    repoURL: git@github.com:MkultraUSA/pi-cluster.git
    targetRevision: main
    path: apps/ubuntu-demo/base
  destination:
    server: https://kubernetes.default.svc
    namespace: registry
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
