apiVersion: v1
kind: ConfigMap
metadata:
  name: patch-demo-dockerfile
  namespace: registry
data:
  Dockerfile: |
    FROM python:3.11-slim-bookworm
    ARG BUILD_STAGE=unknown
    RUN mkdir -p /app && echo -n "$BUILD_STAGE" > /app/BUILD_STAGE && date -u +%Y-%m-%dT%H:%M:%SZ > /app/BUILT_AT
    CMD ["python3", "-m", "http.server", "8000", "--directory", "/app"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kaniko-build-v1
  namespace: registry
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: kaniko
          image: ghcr.io/kaniko-project/executor:v1.23.2
          args:
            - --dockerfile=/workspace/Dockerfile
            - --context=/workspace
            - --build-arg=BUILD_STAGE=v1-plain-base
            - --destination=registry.registry.svc:5000/patch-demo:v1
            - --insecure
            - --insecure-pull
            - --snapshot-mode=redo
            - --cache=false
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {memory: 1200Mi}
          volumeMounts:
            - {name: dockerfile, mountPath: /workspace}
      volumes:
        - name: dockerfile
          configMap: {name: patch-demo-dockerfile}
