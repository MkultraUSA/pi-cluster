# Build recipe for the pipeline's utility image: actuator + publisher scripts
# baked in (built in-cluster by kaniko, like every image here). The scripts
# live in this ConfigMap — single source of truth, as with page-server.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: actuator-build-files
  namespace: registry
data:
  Dockerfile: |
    FROM python:3.11-slim-bookworm
    RUN apt-get update && apt-get install -y --no-install-recommends git openssh-client \
        && rm -rf /var/lib/apt/lists/*
    COPY actuate.py publish.py /actuator/
    CMD ["python3", "/actuator/actuate.py"]
  actuate.py: |
    #!/usr/bin/env python3
    """patch-actuator: closes the self-patching loop.

    Reads the latest trivy scan verdict from the registry PVC. If fixable
    vulnerabilities exist (or --force), it:
      1. rebuilds patch-demo in-cluster via kaniko with Debian security fixes
         baked in (apt upgrade at build time) under a NEW immutable tag,
      2. bumps the tag in git — the deploy path is a commit, never kubectl,
      3. ArgoCD's auto-sync rolls the fleet with readiness gates,
      4. writes a timestamped evidence record to the PVC.

    RBAC: runs as ServiceAccount patch-actuator — may create/watch build Jobs
    and read scan data. It may NOT touch Deployments; the deployment changes
    only because git changed. Least privilege by construction.
    """
    import glob
    import json
    import os
    import subprocess
    import sys
    import time
    import urllib.request

    NS = "registry"
    REGISTRY = "registry.registry.svc:5000"
    IMAGE = "patch-demo"
    REPO = "git@github.com:MkultraUSA/pi-cluster.git"
    REPO_DIR = "/tmp/pi-cluster"
    DEPLOY_FILE = f"{REPO_DIR}/apps/patch-demo/base/deployment.yaml"
    SCAN_DIR = "/data/scans"
    EVIDENCE_DIR = "/data/patched-state"
    FORCE = "--force" in sys.argv
    K8S_TOKEN = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()
    K8S_CA = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    GIT_KEY = "/git-key/id_ed25519"
    GIT_ENV = dict(os.environ, GIT_SSH_COMMAND=f"ssh -i {GIT_KEY} -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes")
    LOG = lambda m: print(f"[actuate {time.strftime('%H:%M:%S')}] {m}", flush=True)


    def k8s(method, path, body=None):
        req = urllib.request.Request(
            f"https://kubernetes.default.svc{path}",
            data=json.dumps(body).encode() if body else None,
            method=method,
            headers={"Authorization": f"Bearer {K8S_TOKEN}", "Content-Type": "application/json"},
        )
        ctx = __import__("ssl").create_default_context(cafile=K8S_CA)
        with urllib.request.urlopen(req, context=ctx) as r:
            data = r.read()
        return json.loads(data) if data else {}


    def latest_scan():
        files = sorted(glob.glob(f"{SCAN_DIR}/{IMAGE}-*.json"), key=os.path.getmtime)
        if not files:
            return None, []
        latest = files[-1]
        with open(latest) as f:
            report = json.load(f)
        vulns = [v for r in report.get("Results", []) for v in (r.get("Vulnerabilities") or [])]
        fixable = [v for v in vulns if v.get("FixedVersion")]
        return latest, fixable


    def current_tag():
        with open(DEPLOY_FILE) as f:
            for line in f:
                if "image:" in line and f"/{IMAGE}:" in line:
                    return line.strip().split(f"{IMAGE}:")[1]
        raise SystemExit("current tag not found in deployment.yaml")


    def rebuild(new_tag):
        """Rebuild the image with today's Debian security fixes under a new tag."""
        tag_cm = f"patch-demo-dockerfile-{new_tag}"
        dockerfile = open(f"{REPO_DIR}/infrastructure/patch-pipeline/recipes/build-v1.yaml").read()
        # The recipe's ConfigMap carries the Dockerfile; reuse it verbatim, only the
        # name changes, and BUILD_STAGE records which scan triggered the rebuild.
        body = dockerfile.split("Dockerfile: |", 1)[1].split("---", 1)[0]
        body = "\n".join(l[4:] if l.startswith("    ") else l for l in body.split("\n")).strip("\n") + "\n"
        cm_body = {
            "apiVersion": "v1", "kind": "ConfigMap",
            "metadata": {"name": tag_cm, "namespace": NS},
            "data": {"Dockerfile": body},
        }
        k8s("POST", f"/api/v1/namespaces/{NS}/configmaps", cm_body)
        job = {
            "apiVersion": "batch/v1", "kind": "Job",
            "metadata": {"name": f"kaniko-rebuild-{new_tag}", "namespace": NS},
            "spec": {
                "backoffLimit": 1,
                "template": {"spec": {"restartPolicy": "Never", "containers": [{
                    "name": "kaniko",
                    "image": "gcr.io/kaniko-project/executor:v1.23.2",
                    "args": [
                        "--dockerfile=/workspace/Dockerfile", "--context=/workspace",
                        f"--build-arg=BUILD_STAGE={new_tag}-security-rebuild",
                        f"--destination={REGISTRY}/{IMAGE}:{new_tag}",
                        "--insecure", "--insecure-pull", "--snapshot-mode=redo", "--cache=false",
                    ],
                    "resources": {"requests": {"cpu": "500m", "memory": "512Mi"},
                                  "limits": {"memory": "1200Mi"}},
                    "volumeMounts": [{"name": "dockerfile", "mountPath": "/workspace"}],
                }], "volumes": [{"name": "dockerfile", "configMap": {"name": tag_cm}}]}},
            },
        }
        k8s("POST", f"/apis/batch/v1/namespaces/{NS}/jobs", job)
        LOG(f"rebuild Job kaniko-rebuild-{new_tag} created")
        deadline = time.time() + 25 * 60
        while time.time() < deadline:
            time.sleep(30)
            j = k8s("GET", f"/apis/batch/v1/namespaces/{NS}/jobs/kaniko-rebuild-{new_tag}")
            conds = j.get("status", {}).get("conditions", [])
            for c in conds:
                # k8s >=1.33 uses Complete/FailureCriteriaMet; older used Succeeded/Failed
                if c["type"] in ("Succeeded", "Complete"):
                    LOG("rebuild Succeeded"); return True
                if c["type"] in ("Failed", "FailureCriteriaMet"):
                    LOG("rebuild Failed"); return False
        LOG("rebuild timed out"); return False


    def clone_repo():
        subprocess.run(["rm", "-rf", REPO_DIR], check=True)
        subprocess.run(["git", "clone", "--depth", "1", REPO, REPO_DIR], env=GIT_ENV, check=True, capture_output=True)


    def bump_git(old_tag, new_tag):
        text = open(DEPLOY_FILE).read().replace(f"{IMAGE}:{old_tag}", f"{IMAGE}:{new_tag}")
        open(DEPLOY_FILE, "w").write(text)
        for cmd in (["git", "-C", REPO_DIR, "add", "-A"],
                    ["git", "-C", REPO_DIR, "-c", "user.name=patch-actuator",
                     "-c", "user.email=actuator@pi-cluster.lan", "commit", "-q", "-m",
                     f"patch: bump {IMAGE} {old_tag} -> {new_tag} (security rebuild via trivy verdict)"],
                    ["git", "-C", REPO_DIR, "push", "-q", "origin", "HEAD"]):
            r = subprocess.run(cmd, env=GIT_ENV, capture_output=True, text=True)
            if r.returncode:
                raise SystemExit(f"git failed: {cmd}\n{r.stderr}")
        LOG(f"git bump pushed: {old_tag} -> {new_tag}")


    def main():
        scan_file, fixable = latest_scan()
        clone_repo()
        old_tag = current_tag()
        LOG(f"scan={os.path.basename(scan_file) if scan_file else 'NONE'} "
            f"fixable={len(fixable)} current_tag={old_tag} force={FORCE}")
        if not fixable and not FORCE:
            LOG("verdict: nothing fixable upstream — tracking only, no action")
            return
        if not fixable and FORCE:
            LOG("DRILL MODE: forcing a rebuild with no fixable verdict (test path)")
        stamp = time.strftime("%Y%m%d-%H%M")
        new_tag = f"v{stamp}"
        if not rebuild(new_tag):
            raise SystemExit("rebuild failed — no deploy change, evidence records the failure")
        bump_git(old_tag, new_tag)
        os.makedirs(EVIDENCE_DIR, exist_ok=True)
        evidence = {
            "when": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
            "image": f"{REGISTRY}/{IMAGE}", "old_tag": old_tag, "new_tag": new_tag,
            "scan_file": os.path.basename(scan_file) if scan_file else None,
            "fixable_count": len(fixable),
            "fixable_cves": sorted({v["VulnerabilityID"] for v in fixable})[:25],
            "forced_drill": FORCE and not fixable,
            "rollout": "via git commit -> ArgoCD auto-sync (readiness-gated rolling update)",
        }
        with open(f"{EVIDENCE_DIR}/{IMAGE}-{stamp}.json", "w") as f:
            json.dump(evidence, f, indent=2)
        LOG(f"evidence written: {EVIDENCE_DIR}/{IMAGE}-{stamp}.json")


    if __name__ == "__main__":
        main()
  publish.py: |
    #!/usr/bin/env python3
    """patch-publisher: renders the public status page and pushes it to GitHub Pages.

    Reads from the registry PVC:
      /data/scans/patch-demo-*.json   trivy results per tag (6h cadence)
      /data/patched-state/*.json      actuator evidence (when tags were deployed)
    Renders a dark, self-contained index.html + machine-readable status.json and
    pushes them to the gh-pages branch of the PUBLIC status repo. The cluster
    publishes its own security posture; nothing sensitive leaves the LAN
    (node names and public CVE ids only — no addresses, no credentials).
    """
    import glob
    import html
    import json
    import os
    import subprocess
    import time

    SCAN_DIR = "/data/scans"
    EVIDENCE_DIR = "/data/patched-state"
    IMAGE = "patch-demo"
    STATUS_REPO = "git@github.com:MkultraUSA/pi-cluster-status.git"
    STATUS_DIR = "/tmp/status"
    GIT_KEY = "/status-git-key/id_ed25519"
    GIT_ENV = dict(os.environ, GIT_SSH_COMMAND=f"ssh -i {GIT_KEY} -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes")
    SEV_ORDER = ["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"]
    LOG = lambda m: print(f"[publish {time.strftime('%H:%M:%S')}] {m}", flush=True)


    def scans():
        out = []
        for path in sorted(glob.glob(f"{SCAN_DIR}/{IMAGE}-*.json"), key=os.path.getmtime):
            tag = os.path.basename(path)[len(IMAGE) + 1:-5]
            r = json.load(open(path))
            vulns = [v for res in r.get("Results", []) for v in (res.get("Vulnerabilities") or [])]
            counts = {}
            for v in vulns:
                sev = v.get("Severity", "UNKNOWN").upper()
                counts[sev] = counts.get(sev, 0) + 1
            fixable = sorted({v["VulnerabilityID"] for v in vulns if v.get("FixedVersion")})
            out.append({
                "tag": tag,
                "scanned": time.strftime("%Y-%m-%d %H:%M UTC", time.gmtime(os.path.getmtime(path))),
                "total": len(vulns),
                "counts": {s: counts.get(s, 0) for s in SEV_ORDER if counts.get(s)},
                "fixable": fixable,
            })
        return out


    def timeline():
        rows = []
        for path in sorted(glob.glob(f"{EVIDENCE_DIR}/*.json"), key=os.path.getmtime, reverse=True):
            e = json.load(open(path))
            rows.append(e)
        return rows


    def render(scans_data, tl):
        now = time.strftime("%Y-%m-%d %H:%M UTC", time.gmtime())
        rows = ""
        for s in scans_data:
            sev = " ".join(f'<span class="sev {k.lower()}">{k}:{v}</span>' for k, v in s["counts"].items()) or '<span class="ok">clean</span>'
            verdict = ('<span class="bad">REBUILD+REPLACE DUE</span>' if s["fixable"]
                       else '<span class="ok">NO ACTION REQUIRED</span>')
            fix = f'fixable: {len(s["fixable"])}' + (f' <span class="meta">({", ".join(s["fixable"][:6])}{"…" if len(s["fixable"]) > 6 else ""})</span>' if s["fixable"] else "")
            rows += f'<tr><td><b>{html.escape(s["tag"])}</b></td><td>{sev}</td><td>{fix}</td><td>{verdict}</td><td class="meta">{s["scanned"]}</td></tr>'
        tlrows = ""
        for e in tl:
            cves = ", ".join(e.get("fixable_cves", [])[:6]) or "drill"
            tlrows += (f'<tr><td>{e.get("when","?")}</td><td>{html.escape(e.get("old_tag","?"))} → '
                       f'<b>{html.escape(e.get("new_tag","?"))}</b></td><td>{html.escape(cves)}</td>'
                       f'<td>{"drill" if e.get("forced_drill") else "advisory-driven"}</td></tr>')
        if not tlrows:
            tlrows = '<tr><td colspan="4" class="meta">no rebuilds yet — scans verdict-tracked</td></tr>'
        return f"""<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>pi-cluster — live security posture</title><style>
    body{{font-family:system-ui,sans-serif;margin:2rem auto;max-width:60rem;background:#0d1117;color:#e6edf3;padding:0 1rem}}
    h1{{color:#58a6ff}} h2{{color:#7ee787;margin-top:2rem}}
    table{{border-collapse:collapse;margin:.5rem 0;width:100%}} td,th{{border:1px solid #30363d;padding:.45rem .8rem;text-align:left}}
    th{{background:#161b22}} .ok{{color:#3fb950}} .bad{{color:#f85149}} .meta{{color:#8b949e;font-size:.85rem}}
    .sev{{margin-right:.4rem}} .sev.critical{{color:#f85149;font-weight:700}} .sev.high{{color:#f0883e}} .sev.medium{{color:#d29922}} .sev.low{{color:#8b949e}}
    code{{background:#161b22;padding:.1rem .35rem;border-radius:4px}}
    </style></head><body>
    <h1>pi-cluster — live security posture</h1>
    <p class="meta">A 4-node Raspberry Pi Kubernetes cluster that rebuilds and replaces its own
    images when CVE advisories make fixes available. Rendered {now} by the cluster itself.</p>
    <h2>How it works</h2>
    <p>Every 6 hours the cluster scans every image it runs (trivy, DB auto-refreshed from CVE feeds).
    A verdict engine marks images <i>REBUILD+REPLACE DUE</i> when upstream fixes exist. The actuator
    then rebuilds the image in-cluster with Debian security patches baked in, commits the new tag to
    git, and ArgoCD rolls the fleet behind readiness gates — with a timestamped evidence record for
    every action. Humans gate only the risky parts: k3s upgrades and major version bumps.</p>
    <h2>Images under watch</h2>
    <table><tr><th>image:tag</th><th>open CVEs</th><th>fixable upstream</th><th>verdict</th><th>scanned</th></tr>
    {rows}</table>
    <h2>Patch timeline — when fixes were deployed</h2>
    <table><tr><th>when (UTC)</th><th>tag change</th><th>advisories addressed</th><th>trigger</th></tr>
    {tlrows}</table>
    <p class="meta">Generated by the patch-publisher Job inside the cluster · machine-readable:
    <a href="status.json" style="color:#58a6ff">status.json</a> · source cluster: private repo, pipeline code on request</p>
    </body></html>"""


    def main():
        scans_data, tl = scans(), timeline()
        os.makedirs("/tmp/render", exist_ok=True)
        open("/tmp/render/index.html", "w").write(render(scans_data, tl))
        json.dump({"generated": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                   "images": scans_data, "patch_timeline": tl}, open("/tmp/render/status.json", "w"), indent=2)
        subprocess.run(["rm", "-rf", STATUS_DIR], check=True)
        subprocess.run(["git", "clone", "--depth", "1", "--branch", "gh-pages", STATUS_REPO, STATUS_DIR],
                       env=GIT_ENV, check=True, capture_output=True)
        subprocess.run(["cp", "/tmp/render/index.html", "/tmp/render/status.json", STATUS_DIR + "/"], check=True)
        cmds = [["git", "-C", STATUS_DIR, "add", "-A"],
                    ["git", "-C", STATUS_DIR, "-c", "user.name=patch-publisher", "-c", "user.email=publisher@pi-cluster.lan",
                     "commit", "-q", "-m", f"status update {time.strftime('%Y-%m-%d %H:%M UTC', time.gmtime())}"],
                ["git", "-C", STATUS_DIR, "push", "-q", "origin", "gh-pages"]]
        for cmd in cmds:
            r = subprocess.run(cmd, env=GIT_ENV, capture_output=True, text=True)
            if r.returncode and "nothing to commit" not in r.stderr:
                raise SystemExit(f"git failed: {cmd}\n{r.stderr}")
        LOG(f"published: {len(scans_data)} tags, {len(tl)} timeline entries")


    if __name__ == "__main__":
        main()
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kaniko-build-actuator
  namespace: registry
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: deref-context
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "cp -L /cm/* /ws/ && ls -la /ws/"]
          volumeMounts:
            - {name: cm-files, mountPath: /cm}
            - {name: workspace, mountPath: /ws}
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:v1.23.2
          args:
            - --dockerfile=/workspace/Dockerfile
            - --context=/workspace
            - --destination=registry.registry.svc:5000/actuator:v1
            - --insecure
            - --insecure-pull
            - --snapshot-mode=redo
            - --cache=false
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {memory: 1200Mi}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
      volumes:
        - name: cm-files
          configMap: {name: actuator-build-files}
        - name: workspace
          emptyDir: {}
