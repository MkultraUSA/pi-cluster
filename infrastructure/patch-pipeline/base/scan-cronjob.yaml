apiVersion: batch/v1
kind: CronJob
metadata:
  name: pipeline-scan
  namespace: registry
spec:
  # Hourly (PHP2Shell lesson: exploitation went broad within hours of patch;
  # the verdict chain must be <=1h, not <=12h).
  schedule: "0 * * * *"          # every 6h — as-warranted cadence
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: trivy
              image: docker.io/aquasec/trivy:0.58.2
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  mkdir -p /data/scans /data/trivy-cache
                  # Dynamic: every repo and every tag in the registry, so a
                  # new image is covered the moment it is pushed. A hardcoded
                  # tag list went stale on the first actuator-minted tag.
                  REPOS=$(wget -qO- registry.registry.svc:5000/v2/_catalog \
                    | tr -d '{}"' | sed 's/.*repositories:\[//;s/\]$//' | tr ',' '\n')
                  for REPO in $REPOS; do
                    SAFE=$(echo "$REPO" | tr '/' '-')
                    TAGS=$(wget -qO- "registry.registry.svc:5000/v2/$REPO/tags/list" \
                      | tr -d '{}"' | sed 's/.*tags:\[//;s/\]$//' | tr ',' '\n')
                    echo "scanning repo: $REPO tags: $TAGS"
                    for TAG in $TAGS; do
                      [ -n "$TAG" ] || continue
                      trivy image \
                        --db-repository=public.ecr.aws/aquasecurity/trivy-db \
                        --cache-dir /data/trivy-cache \
                        --insecure --scanners=vuln --severity=HIGH,CRITICAL \
                        --format=json \
                        --output=/data/scans/$SAFE-$TAG.json \
                        registry.registry.svc:5000/$REPO:$TAG
                    done
                  done
                  echo "scans complete $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              env:
                - {name: TRIVY_CACHE_DIR, value: /data/trivy-cache}
              resources:
                requests: {cpu: 500m, memory: 512Mi}
                limits: {memory: 1500Mi}
              volumeMounts:
                - {name: data, mountPath: /data}
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: registry-data}
