apiVersion: v1
kind: ConfigMap
metadata:
  name: page-server
  namespace: registry
data:
  page-server.py: |
    (placeholder — applied from file by kubectl)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-page
  annotations:
    cluster.homelab.example/deployed-by: argocd-gitops
  namespace: registry
spec:
  replicas: 1
  selector: {matchLabels: {app: pipeline-page}}
  template:
    metadata:
      labels: {app: pipeline-page}
    spec:
      nodeSelector: {kubernetes.io/hostname: cluster1}   # PVC locality (local-path)
      containers:
        - name: page
          image: python:3.11-slim-bookworm
          command: ["python3", "/page/page-server.py"]
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: script, mountPath: /page}
            - {name: data, mountPath: /data, readOnly: true}
      volumes:
        - name: script
          configMap: {name: page-server}
        - name: data
          persistentVolumeClaim: {claimName: registry-data}
