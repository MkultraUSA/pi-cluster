apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: registry
spec:
  accessModes: ["ReadWriteOnce"]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1
  selector: {matchLabels: {app: registry}}
  template:
    metadata:
      labels: {app: registry}
    spec:
      nodeSelector: {kubernetes.io/hostname: cluster1}
      containers:
        - name: registry
          image: registry:2.8.3
          env:
            - {name: REGISTRY_HTTP_ADDR, value: "0.0.0.0:5000"}
            - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}
          ports: [{containerPort: 5000}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: registry-data}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  selector: {app: registry}
  ports:
    - {port: 5000, nodePort: 30500, name: http}
  type: NodePort
