# Every manual in manifest.csv -> PVC epubs (192.168.86.128:/srv/bbpool1/epubs). Finished books are skipped, so re-running is safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: epub-batch
  namespace: libertas
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: kubernetes.io/hostname, operator: In, values: [cluster2, cluster3]}
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
      - name: convert
        image: 192.168.86.188:30500/libertas/epub-converter:0.1.1   # arm64, in-cluster registry
        imagePullPolicy: IfNotPresent
        args: ["--manifest", "/data/manuals/manifest.csv", "--pdf-dir", "/data/manuals", "/data/epubs"]
        resources:
          requests: {cpu: "1", memory: 1Gi}
          limits: {cpu: "4", memory: 4Gi}
        volumeMounts:
        - {name: manuals, mountPath: /data/manuals, readOnly: true}
        - {name: epubs, mountPath: /data/epubs}
      volumes:
      - {name: manuals, persistentVolumeClaim: {claimName: manuals, readOnly: true}}
      - {name: epubs, persistentVolumeClaim: {claimName: epubs}}
