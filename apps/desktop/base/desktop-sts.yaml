apiVersion: v1
kind: Namespace
metadata:
  name: desktop
---
apiVersion: v1
kind: Secret
metadata:
  name: desktop-vnc
  namespace: desktop
stringData:
  VNC_PW: "desktop-lan-2026"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: desktop
  namespace: desktop
spec:
  replicas: 2
  serviceName: desktop
  selector: {matchLabels: {app: desktop}}
  template:
    metadata:
      labels: {app: desktop}
    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: desk
          image: 192.168.86.188:30500/pi-desktop:v7
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - {name: VNC_PW, valueFrom: {secretKeyRef: {name: desktop-vnc, key: VNC_PW}}}
          ports: [{containerPort: 6080}, {containerPort: 5900}]
          readinessProbe:
            httpGet: {path: /vnc.html, port: 6080}
            initialDelaySeconds: 20
          resources:
            requests: {cpu: 900m, memory: 1Gi}
            limits: {cpu: 1500m, memory: 1500Mi}
          volumeMounts:
            - {name: home, mountPath: /home/deskuser}
  volumeClaimTemplates:
    - metadata: {name: home}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 2Gi}}
