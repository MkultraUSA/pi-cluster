apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: smoke-ds
  namespace: smoke
spec:
  selector:
    matchLabels:
      app: smoke
  template:
    metadata:
      labels:
        app: smoke
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: busy
          image: docker.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "httpd -f -p 8080 -h /www"]
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
