apiVersion: v1
kind: Namespace
metadata:
  name: home-assistant
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ha-config
  namespace: home-assistant
spec:
  storageClassName: nfs
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      # Host networking on cluster3: LAN discovery (Cast, Sonos, ESPHome, UPnP) and the node's
      # onboard Bluetooth (hci0, via host D-Bus) for the Govee BLE sensors. UI: http://192.168.86.251:8123
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: cluster3
      containers:
        - name: home-assistant
          # Pinned to the standalone Pi's version so its backup restores cleanly.
          image: ghcr.io/home-assistant/home-assistant:2026.11.1
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          ports:
            - containerPort: 8123
          readinessProbe:
            httpGet: {path: /, port: 8123}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {memory: 1536Mi}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: dbus, mountPath: /run/dbus, readOnly: true}
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: ha-config}
        - name: dbus
          hostPath: {path: /run/dbus, type: Directory}
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  type: NodePort
  selector:
    app: home-assistant
  ports:
    - port: 8123
      targetPort: 8123
      nodePort: 30082
